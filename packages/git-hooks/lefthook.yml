# Hooks de git de Henko. Cada repo los toma con un lefthook.yml de una línea:
#
#   extends:
#     - node_modules/@henko-software/git-hooks/lefthook.yml
#
# ESLint busca la config desde cada archivo (flag v10_config_lookup_from_file):
# en un monorepo, cada paquete tiene la suya.
#
# Si un hook falla, el problema es el código: prohibido --no-verify.

pre-commit:
  piped: true
  commands:
    1_eslint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec eslint --flag v10_config_lookup_from_file --no-warn-ignored --fix --max-warnings=0 {staged_files}
      stage_fixed: true
    2_prettier:
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,css,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
