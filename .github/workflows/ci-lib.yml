# CI de Henko para monorepos de librerías y servicios Node (pnpm). Lo llama
# el ci.yml de cada repo:
#
#   jobs:
#     ci:
#       uses: Henko-Software/henko-standards/.github/workflows/ci-lib.yml@v0
#       with:
#         postgres: true   # levanta Postgres 16 para los tests de integración
#
# Corre: secretos (gitleaks), `pnpm check`, `pnpm typecheck`, `pnpm build`
# y `pnpm test`. Con `postgres: true`, los tests reciben
# HENKO_TEST_DATABASE_URL apuntando a una base vacía.
name: CI lib (henko-standards)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      postgres:
        description: Levanta Postgres 16 y expone HENKO_TEST_DATABASE_URL.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secretos
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (versión y checksum fijos)
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gl.tgz" | sha256sum -c -
          tar -xzf "$dir/gl.tgz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: Gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1 .

  verify:
    name: Formato, lint, tipos, build y tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: henko
          POSTGRES_PASSWORD: henko
          POSTGRES_DB: henko_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U henko" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HENKO_TEST_DATABASE_URL: ${{ inputs.postgres && 'postgres://henko:henko@localhost:5432/henko_test' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
